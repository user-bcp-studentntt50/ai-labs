<app-payment-shell [title]="title">
  <label for="contact-search">{{ searchLabel }}</label>
  <div class="payment-field">
    <svg class="payment-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" />
      <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    <input
      id="contact-search"
      type="search"
      name="contact-search"
      [(ngModel)]="query"
      [placeholder]="searchPlaceholder"
    />
  </div>

  <ul class="contact-list">
    <li *ngFor="let contact of visibleContacts">
      <button type="button" class="payment-card contact-row" (click)="selectContact(contact)">
        <span class="payment-avatar" aria-hidden="true">{{ initials(contact) }}</span>
        <span class="contact-text">
          <span class="contact-name">{{ contact.displayName }}</span>
          <span class="contact-alias">{{ maskedAlias(contact) }}</span>
        </span>
        <svg class="payment-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </li>
  </ul>

  <p *ngIf="!visibleContacts.length" role="status">{{ emptyResultsMessage }}</p>
</app-payment-shell>
